<h4>用户管理</h4>

<div class="card mb-3">
    <div class="card-header">手动充值</div>
    <div class="card-body">
        <form method="post" action="/users/recharge">
            <div class="row g-2">
                <div class="col-md-3"><input type="number" class="form-control" name="telegram_id" required placeholder="Telegram ID"></div>
                <div class="col-md-2"><input type="number" step="0.01" class="form-control" name="amount" required placeholder="充值金额"></div>
                <div class="col-md-3"><input type="text" class="form-control" name="note" placeholder="备注（可选）"></div>
                <div class="col-md-2"><button class="btn btn-success w-100">确认充值</button></div>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">用户列表</div>
    <div class="card-body">
{% if users %}
<table class="table table-sm mb-0">
<thead><tr><th>TG ID</th><th>用户名</th><th>余额</th><th>VIP</th><th>注册时间</th></tr></thead>
<tbody>
{% for u in users %}
<tr>
    <td>{{u['telegram_id']}}</td>
    <td>@{{u['username'] or ''}}</td>
    <td>¥{{u['balance']}}</td>
    <td>{% if u['is_vip'] %}✅{% else %}❌{% endif %}</td>
    <td>{{u['created_at']}}</td>
</tr>
{% endfor %}
</tbody></table>
{% else %}<p class="text-muted mb-0">暂无用户</p>{% endif %}
</div></div>
