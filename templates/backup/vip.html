<h4>VIP 用户管理</h4>

<div class="card mb-3">
    <div class="card-header">开通 VIP</div>
    <div class="card-body">
        <form method="post" action="/vip/set">
            <input type="hidden" name="is_vip" value="1">
            <div class="row g-2">
                <div class="col-md-3"><input type="number" class="form-control" name="telegram_id" required placeholder="Telegram ID"></div>
                <div class="col-md-2"><button class="btn btn-success w-100">开通VIP</button></div>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">用户列表</div>
    <div class="card-body">
{% if users %}
<table class="table table-sm mb-0">
<thead><tr><th>TG ID</th><th>用户名</th><th>余额</th><th>VIP</th><th>操作</th></tr></thead>
<tbody>
{% for u in users %}
<tr>
    <td>{{u['telegram_id']}}</td>
    <td>@{{u['username'] or ''}}</td>
    <td>¥{{u['balance']}}</td>
    <td>{% if u['is_vip'] %}✅{% else %}❌{% endif %}</td>
    <td>
        {% if u['is_vip'] %}
        <form method="post" action="/vip/set" style="display:inline"><input type="hidden" name="telegram_id" value="{{u['telegram_id']}}"><input type="hidden" name="is_vip" value="0"><button class="btn btn-outline-danger btn-sm">取消VIP</button></form>
        {% else %}
        <form method="post" action="/vip/set" style="display:inline"><input type="hidden" name="telegram_id" value="{{u['telegram_id']}}"><input type="hidden" name="is_vip" value="1"><button class="btn btn-outline-success btn-sm">开通VIP</button></form>
        {% endif %}
    </td>
</tr>
{% endfor %}
</tbody></table>
{% else %}<p class="text-muted mb-0">暂无用户</p>{% endif %}
</div></div>
