<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>频道克隆系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; background: linear-gradient(135deg, #e8f0fe, #d4e4f7); font-family: 'Segoe UI', system-ui, sans-serif; }
        .form-signin { max-width: 400px; padding: 2rem; margin: auto; }
        .card { background: rgba(255,255,255,0.92) !important; backdrop-filter: blur(16px); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.06); }
        .card-body { padding: 2.5rem; }
        .card h3 { color: #1a365d; font-weight: 700; }
        .form-control { background: rgba(255,255,255,0.9) !important; border-radius: 12px; padding: 12px 18px; }
        .btn-primary { background: linear-gradient(135deg, #2b6cb0, #4a90d9); border-radius: 12px; padding: 12px; font-weight: 600; color: #fff; border: none; }
        .alert-danger { border-radius: 12px; }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="form-signin card shadow">
        <div class="card-body">
            <div class="text-center mb-4"><i class="bi bi-clipboard-check" style="font-size: 4rem; color: #2b6cb0;"></i></div>
            <h3 class="mb-3 text-center">频道克隆系统</h3>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="post">
                <div class="mb-3"><label class="form-label">管理密码</label><input type="password" class="form-control" name="password" required placeholder="请输入密码..."></div>
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
        </div>
    </div>
</body>
</html>
