{% extends "base.html" %}

{% block content %}
<h4>充值管理</h4>

<div class="card mb-3">
    <div class="card-header">💰 充值记录</div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>ID</th><th>用户</th><th>金额</th><th>状态</th><th>备注</th><th>时间</th></tr></thead>
                <tbody>
                {% for p in payments %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.telegram_id }}</td>
                    <td>¥{{ p.amount }}</td>
                    <td><span class="badge bg-{{ 'success' if p.status == 'approved' else 'warning' }}">{{ p.status }}</span></td>
                    <td>{{ p.note or '-' }}</td>
                    <td>{{ p.created_at.strftime('%Y-%m-%d %H:%M') if p.created_at else '-' }}</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
