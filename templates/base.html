<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>频道克隆系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- 侧边栏 -->
        <nav class="col-md-2 bg-white vh-100 p-3 border-end">
            <h5 class="text-center mb-3">频道克隆</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'dashboard' else '' }}" href="/dashboard">仪表盘</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'accounts' else '' }}" href="/accounts">账号管理</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'clone' else '' }}" href="/clone">创建克隆</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'users' else '' }}" href="/users">用户管理</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'payments' else '' }}" href="/payments">充值管理</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'prices' else '' }}" href="/prices">价格设置</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'filters' else '' }}" href="/filters">广告过滤</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'vip' else '' }}" href="/vip">VIP管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/support">客服设置</a></li>
                <li class="nav-item"><a class="nav-link" href="/logs">操作日志</a></li>
                <li class="nav-item"><a class="nav-link {{ 'active' if active_page == 'tasks' else '' }}" href="/tasks">任务列表</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/change-password">修改密码</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/logout">退出</a></li>
            </ul>
        </nav>
        <!-- 主内容 -->
        <main class="col-md-10 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
